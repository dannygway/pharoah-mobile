name: Deploy to GitHub Pages

# Publishing to Pages is what turns this from a web page into an installable app:
# it gives the game an HTTPS origin, which is the precondition for the service
# worker to register and therefore for "Add to Home Screen" to produce a real
# offline app icon rather than a bookmark.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; just queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Playwright is a devDependency used only by the smoke test. Its postinstall
      # downloads a browser, which is slow at best and a build failure at worst in a
      # runner that does not need it — but the build itself needs the other dev
      # dependencies (vite, typescript), so they cannot simply be omitted.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
